name: Publicar redes

# Cuándo se ejecuta:
#  - A mano: Actions → Publicar redes → Run workflow (eligiendo publicar, comprobar o prueba).
#  - Cuando cambia calendario.json → publicar.
#  - Cuando cambia el publicador → comprobar.
#  - Cuando cambia peticiones/musica.txt → buscar música para Reels (escribe musica.md).
#  - Horas fijas (schedule, en hora UTC; Madrid es UTC+1 en invierno y UTC+2 en verano):
#      de lunes a viernes, cada 15 minutos de 7:07 a 20:52 UTC (8:07-21:52 en invierno, 9:07-22:52 en verano);
#      sábados y domingos, una vez por hora.
#    Unos 1.400 minutos al mes, dentro de los 2.000 gratis de un repositorio privado.
#    El cron de GitHub puede retrasarse: por eso el publicador también publica lo que va con retraso (hasta 24 h).

on:
  schedule:
    - cron: "7,22,37,52 7-20 * * 1-5"
    - cron: "7 8-20 * * 0,6"
  workflow_dispatch:
    inputs:
      accion:
        description: "Qué hacer"
        type: choice
        options: [publicar, comprobar, prueba, musica]
        default: publicar
  push:
    branches: [main]
    paths:
      - calendario.json
      - publicar.mjs
      - peticiones/**
      - .github/workflows/publicar.yml

permissions:
  contents: write

concurrency:
  group: publicador-redes
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Elegir la acción
        id: accion
        env:
          EVENTO: ${{ github.event_name }}
          ACCION_MANUAL: ${{ inputs.accion }}
          ANTES: ${{ github.event.before }}
        run: |
          ACCION=publicar
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            ACCION="$ACCION_MANUAL"
          elif [ "$EVENTO" = "push" ]; then
            CAMBIOS="$(git diff --name-only "$ANTES" HEAD 2>/dev/null || echo publicar.mjs)"
            if echo "$CAMBIOS" | grep -qE '^peticiones/musica\.txt$'; then
              ACCION=musica
            elif echo "$CAMBIOS" | grep -qE '^(publicar\.mjs|\.github/)'; then
              ACCION=comprobar
            fi
          fi
          echo "accion=$ACCION" >> "$GITHUB_OUTPUT"
          echo "Acción: $ACCION"

      - name: Ejecutar el publicador
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ACCION: ${{ steps.accion.outputs.accion }}
        run: node publicar.mjs "$ACCION"

      - name: Guardar el calendario y el estado
        if: always()
        env:
          ACCION: ${{ steps.accion.outputs.accion }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in calendario.json estado.md musica.md musica; do
            if [ -e "$f" ]; then git add -A "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Nada que guardar"
            exit 0
          fi
          git commit -m "Publicador: $ACCION"
          for i in 1 2 3; do
            # Si hay conflicto, gana lo que acaba de apuntar el publicador (lo publicado no se puede perder)
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
